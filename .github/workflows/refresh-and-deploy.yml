# Refreshes StatSniper's ESPN data every morning, commits it, and publishes the website
# (dist/web) to GitHub Pages. Also redeploys on every push to main, and can be run by hand
# from the Actions tab ("Run workflow").
#
# One-time setup on GitHub: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Refresh data and deploy

on:
  schedule:
    - cron: '17 19 * * *'   # 19:17 UTC = 6:17 am Sydney: full daily refresh
    - cron: '7,37 * * * *'  # every 30 minutes: grade finished games (results)
    - cron: '43 8 * * *'    # 8:43 UTC = 7:43 pm Sydney: build tomorrow's picks and stats
  workflow_dispatch:
    inputs:
      job:
        description: 'What to run by hand'
        type: choice
        options: [full, results, picks]
        default: full
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: statsniper-deploy
  cancel-in-progress: false

jobs:
  refresh:
    # Full data refresh: the daily schedule, or by hand with job = full. Not on code pushes.
    if: github.event.schedule == '17 19 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow

      # Each source runs on its own, so one failing feed doesn't stop the rest.
      - name: NBA player game logs
        run: node scripts/fetch-gamelogs.js || echo "::warning::NBA game logs failed"
      - name: UFC fighters
        run: node scripts/fetch-ufc.js || echo "::warning::UFC fighters failed"
      - name: Champions League table, results and fixtures
        run: node scripts/fetch-ucl.js || echo "::warning::Champions League failed"
      - name: NFL and football players, team schedules
        run: node scripts/fetch-athletes.js || echo "::warning::NFL/football players failed"
      - name: Logos and photos (Mondays only, they rarely change)
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/fetch_logos.py || echo "::warning::logos failed"
            python3 scripts/fetch_headshots.py || echo "::warning::photos failed"
          fi
      - name: Search index
        run: node scripts/build-index.js

      - name: Commit refreshed data
        run: |
          git config user.name "StatSniper data bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data public/logos*.js
          if git diff --cached --quiet; then echo "No data changes"; else git commit -m "Daily data refresh $(date -u +%F)" && git push; fi

  results:
    # Every 30 minutes (and by hand with job = results): grade finished games against ESPN,
    # save their game pages and NBA box scores. Needs no AI and no private data.
    if: github.event.schedule == '7,37 * * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'results')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Grade results and fetch box scores
        run: |
          retry() { for i in 1 2 3; do "$@" && return 0; echo "attempt $i of $* failed"; sleep 20; done; return 1; }
          retry node scripts/grade.js
          node scripts/archive.js
          # NBA slate dates: a Sydney day D is the US evening of D-1. Do the older day first.
          retry node scripts/fetch-boxes.js "$(TZ=Australia/Sydney date -d '2 days ago' +%Y%m%d)"
          retry node scripts/fetch-boxes.js "$(TZ=Australia/Sydney date -d yesterday +%Y%m%d)"
      - name: Commit changed data
        id: commit
        run: |
          git config user.name "StatSniper data bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No result changes"; echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Results update $(date -u +%F\ %H:%M) UTC"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  picks:
    # Builds the picks and stats for the next games, with the same scripts the daily runbook used:
    #  evening (7:43 pm Sydney, or by hand with job = picks): tomorrow's NBA slate, football fixtures and goals model,
    #  and on Wednesdays the coming NFL week. Morning (after the 6:17 am refresh): refreshes today's lines and injuries.
    # Lineups are "Projected" (last game's starters plus ESPN's injury list); no private data, no AI, no paid keys.
    needs: refresh
    if: always() && !cancelled() && (github.event.schedule == '17 19 * * *' || github.event.schedule == '43 8 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'picks'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # include whatever the refresh job just committed
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: .cache
          key: soc-summary-${{ github.run_id }}
          restore-keys: soc-summary-
      - name: Build picks and stats
        env:
          MODE: ${{ github.event.schedule == '17 19 * * *' && 'morning' || 'evening' }}
        run: |
          retry() { for i in 1 2 3; do "$@" && return 0; echo "attempt $i of $* failed"; sleep 20; done; return 1; }
          warn() { "$@" || echo "::warning::$* failed"; }
          if [ "$MODE" = morning ]; then
            US=$(TZ=Australia/Sydney date -d yesterday +%Y%m%d)      # today's Sydney NBA slate is yesterday's US date
            DAY=$(TZ=Australia/Sydney date '+%a %-d %b')
          else
            US=$(TZ=Australia/Sydney date +%Y%m%d)                   # tomorrow's Sydney slate is today's US date
            DAY=$(TZ=Australia/Sydney date -d tomorrow '+%a %-d %b')
          fi
          echo "mode=$MODE  NBA US date=$US  football day=$DAY"
          retry node scripts/grade.js            # grade first: the football fetch drops finished fixtures
          node scripts/archive.js
          retry node scripts/fetch-gamelogs.js
          [ "$MODE" = evening ] && warn node scripts/fetch-teams.js
          retry node scripts/fetch-rosters.js    # rosters and current injuries
          warn node scripts/nba-slate.js "$US"
          warn node scripts/prop-finder.js "$DAY"   # our own player prop chances for that slate (Best bets)
          if [ "$MODE" = evening ] && [ "$(TZ=Australia/Sydney date +%u)" = 3 ]; then warn node scripts/nfl-week.js; fi
          retry node scripts/fetch-football.js
          retry node scripts/fetch-ucl.js
          warn node scripts/fetch-ucl-match.js
          warn node scripts/fetch-league-match.js "$DAY"
          warn node scripts/goals-model.js
          warn node scripts/fetch-schedule.js   # every game in the next 30 days (listed until its stats are built)
          node scripts/build-index.js
      - name: Commit changed data
        id: commit
        run: |
          git config user.name "StatSniper data bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No pick changes"; echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Picks and stats update $(date -u +%F\ %H:%M) UTC"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [refresh, results, picks]
    # Publish on a code push, after a successful full refresh, or when a results run changed data.
    if: always() && !cancelled() && (github.event_name == 'push' || needs.refresh.result == 'success' || needs.results.outputs.changed == 'true' || needs.picks.outputs.changed == 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # pick up the data the refresh job just committed
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-web.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
      - id: pages
        uses: actions/deploy-pages@v4
